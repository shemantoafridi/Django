<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create ToDo</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #eeb098;">

<div class="container">
    <h1 class="text-center"><b>Create a New Task</b></h1>
    <form action="{% url 'create_todo' %}" method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="title"><b>Title:</b></label>
            <input type="text" class="form-control" id="title" placeholder="Enter Title" name="title" required>
        </div>
        <div class="form-group">
            <label for="description"><b>Description:</b></label>
            <textarea class="form-control" id="description" placeholder="Enter Description" name="description" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Add Task</button>
    </form>
    <div class="text-center mt-4">
        <a href="{% url 'home' %}" class="btn btn-warning">Back to Home</a>
    </div>
</div>

</body>
</html>
