<!DOCTYPE html>
<html lang="en">
<head>
    <title>View Tasks - ToDo List</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body style="background-color: #98ddee;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <u><h1 class="text-center"><b>ToDo List</b></h1></u>
            <a href="{% url 'home' %}" class="btn btn-secondary mb-3">Back to Home</a>
        </div>
    </div>

    <table class="table mt-3">
        <thead>
            <tr>
                <th style="text-align: center;"><b>Task Id</b></th>
                <th style="text-align: center;"><b>Title</b></th>
                <th style="text-align: center;"><b>Actions</b></th>
            </tr>
        </thead>
        <tbody>
            {% for todo in todos %}
            <tr>
                <td style="color: darkblue; text-align: center;"><b>{{ forloop.counter }}</b></td>
                <td style="color: darkblue; text-align: center;"><b>{{ todo.title }}</b></td>
                <td style="text-align: center;">
                    <button class="btn btn-sm btn-info" data-toggle="collapse" data-target="#task-{{ todo.id }}">View</button>
                </td>
            </tr>
            <tr id="task-{{ todo.id }}" class="collapse">
                <td colspan="3" style="text-align: center;">
                    <div>
                        <p><strong>Description:</strong> {{ todo.description }}</p>
                        <div id="update-form-{{ todo.id }}" style="display:none;">
                            <form method="post" action="{% url 'update_todo' todo.id %}" class="form-inline">
                                {% csrf_token %}
                                <input type="text" name="title" value="{{ todo.title }}" required class="form-control mr-2">
                                <input type="text" name="description" value="{{ todo.description }}" required class="form-control mr-2">
                                <button type="submit" class="btn btn-success btn-sm">Update</button>
                                <a class="btn btn-warning btn-sm" href="#task-{{ todo.id }}" data-toggle="collapse">Cancel</a>
                            </form>
                        </div>
                        <button class="btn btn-secondary btn-sm" onclick="toggleUpdateForm('update-form-{{ todo.id }}')">Edit</button>
                        <a class="btn btn-sm btn-danger" href="{% url 'delete_todo' todo.id %}"><b>Delete</b></a>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<script>
    function toggleUpdateForm(formId) {
        var form = document.getElementById(formId);
        if (form.style.display === "none") {
            form.style.display = "block";
        } else {
            form.style.display = "none";
        }
    }
</script>

</body>
</html>
