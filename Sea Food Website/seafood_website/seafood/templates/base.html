<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Seafood Store{% endblock %}</title>
    
</head>
<body>
    <h1 class="mt-4" style="text-align: center">Welcome to Seafood Store</h1>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        
        <div class="collapse navbar-collapse">
            <div style="display: flex; gap: 20px;">
                <!-- Home Button -->
                <form action="{% url 'home' %}" method="get">
                    <button type="submit" style="background-color: #ff0000; color: white; padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold;">
                        Home
                    </button>
                </form>
        
                <!-- Admin Panel Button -->
                <form action="{% url 'admin:index' %}" method="get">
                    <button type="submit" style="background-color: #ff0000; color: white; padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold;">
                        Admin Panel
                    </button>
                </form>

                <!-- Cart Button -->
                <form action="{% url 'cart' %}" method="get" style="display: inline;">
                    <button type="submit" style="background-color: #ff0000; color: white; padding: 10px 20px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold;">
                    View Cart
                    </button>
                </form>            
                
            </div>
        </div>
        
        
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer mt-5 bg-light text-center py-3">
        <p>&copy; 2024 Seafood Store</p>
    </footer>
</body>
</html>
