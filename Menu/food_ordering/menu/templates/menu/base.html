{% load static %}
<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Food Ordering{% endblock %}</title>
        <!-- CSS Files -->
        <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    </head>


    <body>
        
        <!-- Navigation Bar -->
        <nav>
            <div class="nav-left">
                <a href="/">Menu</a>
                <a href="{% url 'order' %}">Order</a>
                <a href="{% url 'bill' %}">Bill</a>
            </div>
            <a href="{% url 'admin:index' %}" class="admin-button">Admin Panel</a>
        </nav>

        <!-- Clock Container -->
        <div class="clock-container">
            <div class="clock">
                <div class="clock-hand hour" id="hour"></div>
                <div class="clock-hand minute" id="minute"></div>
                <div class="clock-hand second" id="second"></div>

                <!-- Hour Numbers -->
                <div class="hour-number hour-1">1</div>
                <div class="hour-number hour-2">2</div>
                <div class="hour-number hour-3">3</div>
                <div class="hour-number hour-4">4</div>
                <div class="hour-number hour-5">5</div>
                <div class="hour-number hour-6">6</div>
                <div class="hour-number hour-7">7</div>
                <div class="hour-number hour-8">8</div>
                <div class="hour-number hour-9">9</div>
                <div class="hour-number hour-10">10</div>
                <div class="hour-number hour-11">11</div>
                <div class="hour-number hour-12">12</div>
            </div>
            
        </div>

        <div class="date-container">
            <div class="date-face"><div id="currentDate" class="date"></div></div>
           
        </div>

        

        <!-- JavaScript Files -->
        <script src="{% static 'js/clock.js' %}"></script>
        <script src="{% static 'js/date.js' %}"></script>
        
        

        <div class="image" style="background-image: url('{% static "images/food.gif" %}');"></div>
       
        
        <!-- Main Content -->
        <div class="container">
            {% block content %}
            {% endblock %}
            
        </div>

        
    </body>

</html>
