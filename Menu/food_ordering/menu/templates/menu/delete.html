{% extends 'menu/base.html' %}
{% block content %}

<h1 >Delete Order</h1>
<p>Are you sure you want to delete the order for "{{ order.customer_name }}"?</p>

    {% csrf_token %}

</form>
<br>
<a href="{% url 'manage_orders' %}">No, Go Back</a>
</center>
{% endblock %}
